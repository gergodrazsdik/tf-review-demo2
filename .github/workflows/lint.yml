---
name: lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the history
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install tools
        run: |
          scripts/install-ci-tools.sh just actionlint pinact gitleaks tofu tflint
          uv tool install yamllint==1.38.0
      - name: Lint
        run: just lint validate
        env:
          GITHUB_TOKEN: ${{ github.token }}
